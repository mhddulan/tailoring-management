{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Stitching Pro ERP</title>

    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Stitching Pro Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #FFFFFF;
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .login-brand-icon {
            width: 48px;
            height: 48px;
            background: #2563EB;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .login-brand-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0F172A;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            color: #64748B;
            font-size: 0.95rem;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
            border: 1px solid #E2E8F0;
            padding-left: 14px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-login {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #2563EB;
            color: #FFFFFF;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-login:hover {
            background: #1D4ED8;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: #94A3B8;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="login-brand">
        <div class="login-brand-icon">
            <i class="bi bi-scissors"></i>
        </div>
        <div>
            <h2 class="login-brand-title">Stitching Pro</h2>
            <span class="badge bg-primary-subtle text-primary fw-semibold" style="font-size:0.75rem;">TAILORING ERP</span>
        </div>
    </div>

    <p class="login-subtitle">
        Sign in to manage orders, branch performance, and financial reports
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger alert-custom mb-4">
                <i class="bi bi-exclamation-circle-fill me-2"></i>{{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label fw-semibold text-dark fs-7 mb-1">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                <input type="text" name="username" class="form-control border-start-0" placeholder="Enter your username" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold text-dark fs-7 mb-1">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" name="password" class="form-control border-start-0" placeholder="Enter your password" required>
            </div>
        </div>

        <button type="submit" class="btn btn-login d-flex align-items-center justify-content-center gap-2">
            <span>Sign In</span>
            <i class="bi bi-arrow-right"></i>
        </button>
    </form>

    <div class="login-footer">
        &copy; 2026 Stitching Pro &bull; Tailoring Management ERP
    </div>

</div>

</body>
</html>
