{% extends 'base.html' %}

{% block title %}Update Order Status | Stitching Pro{% endblock %}
{% block page_title %}Update Order Status{% endblock %}

{% block content %}

<div class="page-header-block">
    <div>
        <h2 class="page-header-title">Update Order Status</h2>
        <p class="page-header-sub">Select the current stage in tailoring workflow.</p>
    </div>
    <div>
        <a href="javascript:history.back()" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="form-card">
            <form method="POST">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="form-label fw-semibold">Select Status Stage</label>
                    <select name="status" class="form-select form-control-lg">
                        <option value="Pending">Pending</option>
                        <option value="Cutting">Cutting</option>
                        <option value="Stitching">Stitching</option>
                        <option value="Ready">Ready</option>
                        <option value="Delivered">Delivered</option>
                    </select>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-circle-fill me-1"></i> Update Status
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
